name: Build Android App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        run: npm install

      - name: Write google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - name: Sync Capacitor
        run: |
          mkdir -p out
          mkdir -p android/app/src/main/assets/public
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3

      - name: Publish APK to public releases repo
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk vyaparsarthii.apk
          gh release delete latest-android --repo RGGlobalServices/vyaparsarthi-releases --yes --cleanup-tag 2>/dev/null || true
          gh release create latest-android \
            --repo RGGlobalServices/vyaparsarthi-releases \
            --title "Vyapar Sarthi Android App" \
            --notes "Latest Android APK. Download and install on your Android device." \
            vyaparsarthii.apk
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
